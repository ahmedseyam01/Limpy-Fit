<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182E00"/>
      <stop offset="70%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Neon Green Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Silver Bar Gradient -->
    <linearGradient id="silverBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A3A3A3"/>
      <stop offset="100%" stop-color="#525252"/>
    </linearGradient>

    <!-- Neon Green Plate Gradient -->
    <linearGradient id="neonPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DAFF33"/>
      <stop offset="50%" stop-color="#9CFF00"/>
      <stop offset="100%" stop-color="#70B800"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#9CFF00" stroke-width="16" opacity="0.95" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#161616" stroke-width="8"/>

  <!-- Central Dumbbell Artwork -->
  <g transform="translate(256, 256)">
    <!-- FIRST CROSSED DUMBBELL (-45 Deg) -->
    <g transform="rotate(-45)">
      <!-- Steel Bar -->
      <rect x="-170" y="-12" width="340" height="24" rx="12" fill="url(#silverBar)"/>
      <rect x="-65" y="-15" width="130" height="30" rx="6" fill="#9CFF00" opacity="0.9"/>
      
      <!-- Inner Stopper Rings -->
      <rect x="-95" y="-30" width="16" height="60" rx="5" fill="#E5E5E5"/>
      <rect x="79" y="-30" width="16" height="60" rx="5" fill="#E5E5E5"/>

      <!-- Outer Heavy Plates (Left) -->
      <rect x="-140" y="-65" width="32" height="130" rx="10" fill="url(#neonPlate)"/>
      <rect x="-175" y="-85" width="28" height="170" rx="12" fill="#141414" stroke="#9CFF00" stroke-width="10"/>
      <rect x="-195" y="-55" width="15" height="110" rx="6" fill="url(#neonPlate)"/>

      <!-- Outer Heavy Plates (Right) -->
      <rect x="108" y="-65" width="32" height="130" rx="10" fill="url(#neonPlate)"/>
      <rect x="147" y="-85" width="28" height="170" rx="12" fill="#141414" stroke="#9CFF00" stroke-width="10"/>
      <rect x="180" y="-55" width="15" height="110" rx="6" fill="url(#neonPlate)"/>
    </g>

    <!-- SECOND CROSSED DUMBBELL (+45 Deg) -->
    <g transform="rotate(45)">
      <!-- Steel Bar -->
      <rect x="-170" y="-12" width="340" height="24" rx="12" fill="url(#silverBar)"/>
      <rect x="-65" y="-15" width="130" height="30" rx="6" fill="#9CFF00" opacity="0.9"/>
      
      <!-- Inner Stopper Rings -->
      <rect x="-95" y="-30" width="16" height="60" rx="5" fill="#E5E5E5"/>
      <rect x="79" y="-30" width="16" height="60" rx="5" fill="#E5E5E5"/>

      <!-- Outer Heavy Plates (Left) -->
      <rect x="-140" y="-65" width="32" height="130" rx="10" fill="url(#neonPlate)"/>
      <rect x="-175" y="-85" width="28" height="170" rx="12" fill="#141414" stroke="#9CFF00" stroke-width="10"/>
      <rect x="-195" y="-55" width="15" height="110" rx="6" fill="url(#neonPlate)"/>

      <!-- Outer Heavy Plates (Right) -->
      <rect x="108" y="-65" width="32" height="130" rx="10" fill="url(#neonPlate)"/>
      <rect x="147" y="-85" width="28" height="170" rx="12" fill="#141414" stroke="#9CFF00" stroke-width="10"/>
      <rect x="180" y="-55" width="15" height="110" rx="6" fill="url(#neonPlate)"/>
    </g>

    <!-- Central Glowing Core Starburst -->
    <circle cx="0" cy="0" r="32" fill="#9CFF00" opacity="0.85" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
  </g>
</svg>