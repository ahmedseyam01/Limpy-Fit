<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark Luxury Background Frame -->
  <rect width="512" height="512" rx="128" fill="#0A0A0A"/>
  
  <!-- Glowing Neon Accent Border -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#9CFF00" stroke-width="12" opacity="0.85"/>

  <g transform="translate(256, 256)">
    <!-- FIRST DUMBBELL (Angled -45 deg) -->
    <g transform="rotate(-45)">
      <!-- Handle Bar -->
      <rect x="-160" y="-12" width="320" height="24" rx="12" fill="#E5E5E5"/>
      <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#9CFF00"/>
      
      <!-- Left Weights -->
      <rect x="-190" y="-45" width="30" height="90" rx="8" fill="#9CFF00"/>
      <rect x="-220" y="-60" width="30" height="120" rx="10" fill="#161616" stroke="#9CFF00" stroke-width="8"/>
      <rect x="-238" y="-40" width="18" height="80" rx="6" fill="#9CFF00"/>
      
      <!-- Right Weights -->
      <rect x="160" y="-45" width="30" height="90" rx="8" fill="#9CFF00"/>
      <rect x="190" y="-60" width="30" height="120" rx="10" fill="#161616" stroke="#9CFF00" stroke-width="8"/>
      <rect x="220" y="-40" width="18" height="80" rx="6" fill="#9CFF00"/>
    </g>

    <!-- SECOND DUMBBELL (Angled +45 deg) -->
    <g transform="rotate(45)">
      <!-- Handle Bar -->
      <rect x="-160" y="-12" width="320" height="24" rx="12" fill="#FFFFFF"/>
      <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#9CFF00"/>
      
      <!-- Left Weights -->
      <rect x="-190" y="-45" width="30" height="90" rx="8" fill="#9CFF00"/>
      <rect x="-220" y="-60" width="30" height="120" rx="10" fill="#161616" stroke="#9CFF00" stroke-width="8"/>
      <rect x="-238" y="-40" width="18" height="80" rx="6" fill="#9CFF00"/>
      
      <!-- Right Weights -->
      <rect x="160" y="-45" width="30" height="90" rx="8" fill="#9CFF00"/>
      <rect x="190" y="-60" width="30" height="120" rx="10" fill="#161616" stroke="#9CFF00" stroke-width="8"/>
      <rect x="220" y="-40" width="18" height="80" rx="6" fill="#9CFF00"/>
    </g>
  </g>
</svg>